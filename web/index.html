<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="知识库：Markdown 知识管理、混合检索与 LLM 问答客户端">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="知识库">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG renders crisp at any tab size/DPI; PNG is the fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>知识库</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.json">

  <!-- In-page loading screen: the browser chrome's own progress bar is not
       stylable, so brand the content area instead — a seed-color bar where
       the native one sits, logo + wordmark on white, fading out on boot. -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease;
    }
    #splash.hide {
      opacity: 0;
    }
    #splash img {
      width: 96px;
      height: 96px;
    }
    #splash .wordmark {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 20px;
      color: #333333;
      letter-spacing: 2px;
    }
    #splash-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 40%;
      height: 3px;
      border-radius: 0 2px 2px 0;
      background: linear-gradient(90deg, #4f6bed, #8fa4f4);
      animation: splash-slide 1.2s ease-in-out infinite;
    }
    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-bar"></div>
    <img src="favicon.svg" alt="">
    <div class="wordmark">知识库</div>
  </div>

  <!--
    Custom Flutter bootstrap: drive the loader manually so the splash above
    stays up until the app has started, then fade it out. For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hide');
          setTimeout(function () { splash.remove(); }, 450);
        }
      },
    });
  </script>
</body>
</html>
