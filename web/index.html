  <!-- In-page loading screen: the browser chrome's own progress bar is not
       stylable, so brand the content area instead — a seed-color bar where
       the native one sits, logo + wordmark on white, fading out on boot. -->
  <style>
    #splash {
      /* Tracks the app theme: the persisted choice wins (set as
         data-theme-mode on <html> by the early script below), the OS
         scheme is the fallback. Light = Material light surface, dark =
         blue-tinted dark surface, so the hand-off to the app is seamless
         in both. */
      --splash-bg: #ffffff;
      --splash-fg: #333333;
      --splash-accent: #4f6bed;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: var(--splash-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease;
    }
    #splash.hide {
      opacity: 0;
    }
    .splash-mark {
      /* Larger than the login page's mark (iconHeroLg, 96-134px scaled). */
      width: 160px;
      height: 160px;
      color: var(--splash-fg);
    }
    /* M3E-style morphing spinner (see the script at the end of body). */
    .splash-morph {
      width: 56px;
      height: 56px;
    }
    .splash-morph path {
      fill: var(--splash-accent);
    }
    #splash .wordmark {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 20px;
      color: var(--splash-fg);
      letter-spacing: 2px;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme-mode='light']) #splash {
        --splash-bg: #171a22;
        --splash-fg: #e2e4ee;
      }
    }
    /* Explicit in-app pick overrides the OS scheme (equal specificity with
       the media rule above, so source order — after it — decides). */
    html[data-theme-mode='dark'] #splash {
      --splash-bg: #171a22;
      --splash-fg: #e2e4ee;
    }
    #splash-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 40%;
      height: 3px;
      border-radius: 0 2px 2px 0;
      background: linear-gradient(90deg, #4f6bed, #8fa4f4);
      animation: splash-slide 1.2s ease-in-out infinite;
    }
    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
  <script>
    // First-screen theme: honor the app's persisted choice before the
    // splash paints. shared_preferences (web) keeps the Flutter side at
    // localStorage 'flutter.theme.mode' as a JSON string ('"dark"'); the
    // OS scheme stays in charge when the user never picked one. Runs from
    // <head>, so the attribute lands on <html> pre-paint — no flash.
    (function () {
      var stored = localStorage.getItem('flutter.theme.mode');
      if (!stored) return;
      stored = stored.replace(/^"|"$/g, '');
      if (stored !== 'dark' && stored !== 'light') return;
      document.documentElement.setAttribute('data-theme-mode', stored);
      var surface = stored === 'dark' ? '#171a22' : '#ffffff';
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) {
        metas[i].setAttribute('content', surface);
      }
    })();
  </script>
